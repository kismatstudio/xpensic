<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />
    <!-- Brand: a PNG favicon (works in every browser tab / pinned tab) and
         an iOS home-screen icon (apple-touch-icon). Both are loaded from
         the same file so we don't have to ship duplicates. The light/dark
         swap is wired in boot-theme.js so the tab icon follows the theme. -->
    <link rel="icon" type="image/png" sizes="any" href="assets/brand/favicon.png" id="brand-favicon" />
    <link rel="apple-touch-icon" href="assets/brand/favicon.png" />
    <!-- Import map — kept here in case future modules need to resolve a
         bare specifier against the dev server's node_modules. The
         current crypto layer uses the browser-native Web Crypto API
         (globalThis.crypto.subtle) and does not need any mapping. -->
    <title>XPENSIC — Track Expenses. Take Control.</title>
    <script src="js/boot-theme.js"></script>
    <!-- Preconnect to Google Fonts so the Inter/Poppins swap is instant -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/reset.css?v=31" />
    <link rel="stylesheet" href="css/tokens.css?v=31" />
    <link rel="stylesheet" href="css/premium.css?v=31" />
    <link rel="stylesheet" href="css/layout.css?v=31" />
    <link rel="stylesheet" href="css/components.css?v=31" />
    <link rel="stylesheet" href="css/feedback.css?v=31" />
    <link rel="stylesheet" href="css/components/kismat-footer.css?v=31" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Shared brand mark (X + rising arrow). Referenced with <use href="#xp-mark">
         in the header and the nav drawer. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="xp-g-arrow" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#0E8FA6"/>
          <stop offset="1" stop-color="#5FCB6A"/>
        </linearGradient>
        <linearGradient id="xp-g-foot" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0F8F86"/>
          <stop offset="1" stop-color="#17C08A"/>
        </linearGradient>
        <symbol id="xp-mark" viewBox="0 0 320 300">
          <path fill="var(--brand-mark-navy, #0F1B3D)" d="M12 52 L62 50 Q80 50 95 66 L148 125 L106 164 L24 72 Q12 60 12 52 Z"/>
          <path fill="url(#xp-g-arrow)" d="M8 262 L222 44 L226 38 L303 12 L270 86 L262 78 L72 282 Q40 292 22 280 Q8 272 8 262 Z"/>
          <path fill="url(#xp-g-foot)" d="M150 217 L186 178 L282 262 Q286 280 262 285 L230 285 Q215 283 205 272 Z"/>
        </symbol>
      </defs>
    </svg>
    <div class="app">
      <header class="app-header" role="banner">
        <button
          class="icon-btn nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-controls="app-nav"
          aria-expanded="false"
        >
          <span class="icon-btn__bars" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>

        <a class="app-brand" href="#/dashboard" aria-label="Xpensic — Track expenses. Take control.">
          <!-- Brand lockup: vector X+arrow mark + live-text wordmark and
               tagline, so it stays razor sharp and readable in every
               theme (colours come from the --brand-* tokens). -->
          <svg class="brand-mark" viewBox="0 0 320 300" aria-hidden="true" focusable="false"><use href="#xp-mark"></use></svg>
          <span class="brand-type">
            <span class="brand-wordmark">Xpensic</span>
            <span class="brand-tagline">Track expenses. Take control.</span>
          </span>
        </a>

        <div class="app-header__spacer"></div>

        <div class="month-picker" role="group" aria-label="Selected month">
          <button class="icon-btn" type="button" id="month-prev" aria-label="Previous month">
            <span aria-hidden="true">&lsaquo;</span>
          </button>
          <span class="month-picker__label" id="month-label">July 2026</span>
          <button class="icon-btn" type="button" id="month-next" aria-label="Next month">
            <span aria-hidden="true">&rsaquo;</span>
          </button>
        </div>

        <button
          class="theme-toggle"
          type="button"
          id="theme-toggle"
          aria-label="Toggle theme"
          title="Toggle theme (light / dark / system)"
        >
          <span class="theme-toggle__icon" id="theme-icon" aria-hidden="true">◐</span>
          <!-- The inner label is decorative — the rich aria-label on the
               parent button (set from main.js) is the source of truth
               for screen readers, so the visible "Light / Dark / System"
               text is hidden from assistive tech to avoid double-reading. -->
          <span id="theme-label" aria-hidden="true">System</span>
        </button>
      </header>

      <div class="nav-scrim" id="nav-scrim" hidden></div>

      <aside class="app-nav" id="app-nav" aria-label="Primary" aria-hidden="true">
        <section class="app-nav__profile" id="app-nav-profile">
          <!-- Brand + profile rendered by renderNavProfile() in main.js -->
        </section>

        <!-- Quick actions -->
        <div class="app-nav__quick">
          <div class="app-nav__section-label">Quick Actions</div>
          <div class="app-nav__quick-grid">
            <button class="app-nav__quick-btn" type="button" data-quick="add-expense" aria-label="Add expense">
              <span class="app-nav__quick-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              </span>
              <span class="app-nav__quick-label">Add Expense</span>
            </button>
            <button class="app-nav__quick-btn" type="button" data-quick="scan-receipt" aria-label="Scan receipt">
              <span class="app-nav__quick-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </span>
              <span class="app-nav__quick-label">Scan Receipt</span>
            </button>
          </div>
        </div>

        <nav class="app-nav__links">
          <ul class="nav-list" role="list">
            <li><a class="nav-link" href="#/dashboard" data-route="dashboard">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              </span>
              <span class="nav-link__label">Dashboard</span>
            </a></li>
            <li><a class="nav-link" href="#/expenses" data-route="expenses">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
              </span>
              <span class="nav-link__label">Expenses</span>
            </a></li>
            <li><a class="nav-link" href="#/budgets" data-route="budgets">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
              </span>
              <span class="nav-link__label">Budgets</span>
            </a></li>
            <li><a class="nav-link" href="#/categories" data-route="categories">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              </span>
              <span class="nav-link__label">Categories</span>
            </a></li>
            <li><a class="nav-link" href="#/splits" data-route="splits">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </span>
              <span class="nav-link__label">Splits</span>
            </a></li>
            <li><a class="nav-link" href="#/settings" data-route="settings">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              </span>
              <span class="nav-link__label">Settings</span>
            </a></li>
            <li><button class="nav-link nav-link--signout" type="button" id="app-nav-signout" aria-label="Sign out">
              <span class="nav-link__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              </span>
              <span class="nav-link__label">Sign Out</span>
            </button></li>
          </ul>
        </nav>

        <div class="app-nav__footer">
            <button class="app-nav__encrypted" type="button" id="app-nav-encrypted"
              aria-label="Learn about end-to-end encryption"
              title="Learn about end-to-end encryption">
            <span class="app-nav__encrypted-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
            </span>
            <span class="app-nav__encrypted-label">End-to-End Encrypted</span>
            <span class="app-nav__encrypted-info" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7" x2="12.01" y2="7"/></svg>
            </span>
          </button>
        </div>
      </aside>

      <main class="app-main" id="main" tabindex="-1">
        <section class="view" id="view" aria-live="polite">
          <!-- Active view renders here -->
        </section>
      </main>

      <footer class="app-footer" id="kismat-footer">
        <!-- KismatFooter badge renders here -->
      </footer>
          </div>

          <!-- Toast region lives OUTSIDE .app: the .app grid container
               suppresses child transforms in some browsers (the centered
               translate(-50%,-50%) computes to none), which would break
               the centered toast position. As a direct body child the
               transform applies normally. -->
          <div
            class="toast-region"
            id="toast-region"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></div>

    <!-- Cache-busting query param: Chrome aggressively caches parsed ES
         modules even with Cache-Control: no-store. Bump the version number
         whenever you change main.js (or any module it imports) so the
         browser fetches fresh copies instead of serving stale ones. -->
    <script>
      // API base URL. Defaults to same-origin (empty) — in local dev the
      // static server proxies /api/* to the backend, and on Cloudflare
      // Pages a Pages Function (functions/api/[[path]].js) proxies /api/*
      // to the API Worker selected per-environment via the API_ORIGIN
      // Pages env var. Set window.ET_API_BASE ONLY to hard-override the
      // base for a one-off deployment. This keeps staging and production
      // working with zero code changes.
      window.ET_API_BASE = window.ET_API_BASE || "";
    </script>
    <script type="module" src="js/main.js?v=31"></script>
  </body>
</html>
